<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire de contact</title>
    <style>
      /* 1. Style général */
      body {
        font-family: Arial, sans-serif;
        background-color: lightcyan;
        color: darkslategray;
        margin: 0;
      }

      /* 2. En-tête */
      header {
        background-color: royalblue;
        color: white;
        text-align: center;
        padding: 40px;
      }

      h1 {
        font-size: 32px;
      }

      /* 3. Contenu principal */
      main {
        max-width: 700px;
        margin: 30px auto;
        padding: 20px;
      }

      /* 4. Sections */
      section {
        background-color: white;
        padding: 25px;
        margin-bottom: 20px;
        border: 1px solid lightgray;
        border-radius: 10px;
      }

      h2 {
        color: royalblue;
      }

      /* 5. Liens */
      a {
        display: inline-block;
        background-color: royalblue;
        color: white;
        padding: 12px 20px;
        border-radius: 5px;
        text-decoration: none;
      }

      a:hover {
        background-color: darkblue;
      }

      /* 6. Pied de page */
      footer {
        text-align: center;
        padding: 20px;
        color: gray;
      }

      form {
        background-color: lightcyan;
        padding: 20px;
        border-radius: 10px;
      }

      fieldset {
        border: none;
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid lightgray;
        border-radius: 5px;
        box-sizing: border-box;
      }

      textarea {
        height: 100px;
      }

      button {
        background-color: royalblue;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: darkblue;
      }

      @media screen {
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bonjour, moi c'est Alex !</h1>
      <p>Apprenant en développement web</p>
    </header>

    <main>
      <section>
        <h2>Formulaire de contact</h2>
        <form>
          <div>
            <label for="name">Votre nom</label>
            <input type="text" id="name" />
          </div>
          <div>
            <label for="email">Votre email</label>
            <input type="email" id="email" />
          </div>
          <div>
            <label for="message">Votre message</label>
            <textarea name="" id="message"></textarea>
          </div>

          <button>Envoyer</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Ma première page web - 2026</p>
    </footer>
  </body>
</html>
